version: "2.1"

services:
    cms-db:
        image: mysql:8.0
        volumes:
            - "./shared/db:/var/lib/mysql:Z"
        env_file: config.env
        restart: always
        networks:
            - app
    cms-xmr:
        image: ghcr.io/xibosignage/xibo-xmr:1.0
        ports:
            - "9505:9505"
        restart: always
        env_file: config.env
        networks:
            - app
    cms-web:
        build:
          context: .
          dockerfile: Dockerfile
        volumes:
            - "./shared/cms/custom:/var/www/cms/custom:Z"
            - "./shared/backup:/var/www/backup:Z"
            - "./shared/cms/web/theme/custom:/var/www/cms/web/theme/custom:Z"
            - "./shared/cms/library:/var/www/cms/library:Z"
            - "./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z"
            - "./shared/cms/ca-certs:/var/www/cms/ca-certs:Z"
        restart: always
        environment:
            - CMS_DEV_MODE=true
            - MYSQL_HOST=cms-db
            - XMR_HOST=cms-xmr
            - CMS_USE_MEMCACHED=true
            - MEMCACHED_HOST=cms-memcached
            - RTSP_WEB_HOST=rtsp-to-web:8083
        env_file: config.env
        ports:
            - "80:80"
        networks:
            - app
    cms-memcached:
        image: memcached:alpine
        command: memcached -m 15
        restart: always
        networks:
            - app
    cms-quickchart:
        image: ianw/quickchart
        restart: always
        networks:
            - app
    rtsp-to-web:
        image: ghcr.io/deepch/rtsptoweb:v2.4.3
        volumes:
            - "./config.json:/config/config.json"
        networks:
            - app
        ports:
            - "8083:8083"

networks:
  app:
    external: true
    name: app