name: Build and Deploy with Docker Compose

on:
  push:
    branches: ["deploy"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./
          file: ./Dockerfile
          push: true
          load: false
          tags: ghcr.io/noaled-lab/xibo-cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create directory on remote server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.REMOTE_USER }}/xibo-cms

      - name: Copy docker-compose.yml to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: "docker-compose.deploy.yaml"
          target: "/home/${{ secrets.REMOTE_USER }}/xibo-cms/"

      - name: SSH to remote server and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/${{ secrets.REMOTE_USER }}/xibo-cms
            docker compose down
            echo "${{ secrets.DOT_ENV }}" | base64 --decode > /home/${{ secrets.REMOTE_USER }}/xibo-cms/config.env
            docker compose up -d --pull always --remove-orphans
            docker image prune -f