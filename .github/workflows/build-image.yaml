name: Build Docker Image and Push to GHCR

on:
  push:
    branches: ["noaled"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./
          file: ./Dockerfile
          push: true
          load: false
          tags: ghcr.io/noaled-lab/xibo-cms:latest,ghcr.io/noaled-lab/xibo-cms:yangsan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up untagged GHCR images
        run: |
          # GitHub CLI 로그인
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # 모든 버전 조회
          versions=$(gh api /user/packages/container/xibo-cms/versions | jq -r '.[] | "\(.id) \(.metadata.container.tags[]?)"')

          # 반복하여 태그가 없는 버전 삭제
          echo "$versions" | while read id tag; do
            if [ -z "$tag" ]; then
              echo "Deleting untagged version $id"
              gh api -X DELETE /user/packages/container/xibo-cms/versions/$id
            fi
          done

