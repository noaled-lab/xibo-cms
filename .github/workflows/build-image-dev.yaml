name: Build Docker Image and Push to GHCR

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract branch tag
        id: branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          # feature/my-feature-56 -> feature-my-feature-56
          TAG=$(echo "$BRANCH" | sed 's|/|-|g')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./
          file: ./Dockerfile
          push: true
          load: false
          tags: ghcr.io/noaled-lab/xibo-cms:${{ steps.branch.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/noaled-lab/xibo-cms:cache-${{ steps.branch.outputs.tag }}
          cache-to: type=registry,ref=ghcr.io/noaled-lab/xibo-cms:cache-${{ steps.branch.outputs.tag }},mode=max

