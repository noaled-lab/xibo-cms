version: "2.1"

services:
    cms-db:
        image: mysql:8.0
        volumes:
            - "./shared/db:/var/lib/mysql:Z"
        env_file: config.env
        restart: always
        networks:
            - app
    cms-xmr:
        image: ghcr.io/xibosignage/xibo-xmr:1.0
        ports:
            - "9505:9505"
        restart: always
        env_file: config.env
        networks:
            - app
    cms-web:
        image: ghcr.io/noaled-lab/xibo-cms:latest
        volumes:
            - "./shared/cms/custom:/var/www/cms/custom:Z"
            - "./shared/backup:/var/www/backup:Z"
            - "./shared/cms/web/theme/custom:/var/www/cms/web/theme/custom:Z"
            - "./shared/cms/library:/var/www/cms/library:Z"
            - "./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z"
            - "./shared/cms/ca-certs:/var/www/cms/ca-certs:Z"
        restart: always
        environment:
            - MYSQL_HOST=cms-db
            - XMR_HOST=cms-xmr
            - CMS_USE_MEMCACHED=true
            - MEMCACHED_HOST=cms-memcached
            - CMS_PHP_UPLOAD_MAX_FILESIZE=4G # PHP 업로드 설정 - 4GB까지 허용
            - CMS_PHP_POST_MAX_SIZE=4G # PHP 업로드 설정 - 4GB까지 허용
            - CMS_PHP_MAX_EXECUTION_TIME=3600 # PHP 최대 실행 시간 설정
            - CMS_PHP_CLI_MAX_EXECUTION_TIME=3600 # PHP CLI 최대 실행
            - CMS_PHP_SESSION_GC_MAXLIFETIME=14400 # PHP 세션 최대 수명 설정
            - CMS_APACHE_START_SERVERS=4 # Apache 성능 최적화
            - CMS_APACHE_MIN_SPARE_SERVERS=8
            - CMS_APACHE_MAX_SPARE_SERVERS=16
            - CMS_APACHE_MAX_REQUEST_WORKERS=100
            - CMS_APACHE_MAX_CONNECTIONS_PER_CHILD=1000
            - CMS_APACHE_TIMEOUT=60
            - CMS_APACHE_LOG_REQUEST_TIME=false
        env_file: config.env
        ports:
            - "8089:80"
        networks:
            - app
    cms-memcached:
        image: memcached:alpine
        command: memcached -m 15
        restart: always
        networks:
            - app
    cms-quickchart:
        image: ianw/quickchart
        restart: always
        networks:
                - app

networks:
  app:
    external: true
    name: app