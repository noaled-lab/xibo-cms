version: "3"

services:
  db:
    image: mysql:8.0
    # ports:
    #   - "3307:3306"
    volumes:
      - ./containers/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "cms"

  xmr:
    image: ghcr.io/xibosignage/xibo-xmr:develop
    ports:
      - "9506:9505"
    environment:
      XMR_DEBUG: "true"
      IPV6PUBSUPPORT: "false"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/var/www/cms
    ports:
      - "8000:80"
    environment:
      CMS_DEV_MODE: "true"
      MYSQL_DATABASE: "cms"
      # PHP 업로드 설정 - 4GB까지 허용
      CMS_PHP_UPLOAD_MAX_FILESIZE: "4G"
      CMS_PHP_POST_MAX_SIZE: "4G"
      CMS_PHP_MAX_EXECUTION_TIME: "3600"
      CMS_PHP_CLI_MAX_EXECUTION_TIME: "3600"
      CMS_PHP_MEMORY_LIMIT: "1G"
      CMS_PHP_SESSION_GC_MAXLIFETIME: "14400"
      # Apache 성능 최적화
      CMS_APACHE_START_SERVERS: "4"
      CMS_APACHE_MIN_SPARE_SERVERS: "8"
      CMS_APACHE_MAX_SPARE_SERVERS: "16"
      CMS_APACHE_MAX_REQUEST_WORKERS: "100"
      CMS_APACHE_MAX_CONNECTIONS_PER_CHILD: "1000"
      CMS_APACHE_TIMEOUT: "60"
      CMS_APACHE_LOG_REQUEST_TIME: "false"

  memcached:
    image: memcached:alpine
    command: memcached -m 15

  swagger:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8080:8080"
    environment:
      - API_URL=http://localhost/swagger.json

  quickchart:
    image: ianw/quickchart
